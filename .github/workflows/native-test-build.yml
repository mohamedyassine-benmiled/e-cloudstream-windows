name: Native test build

# Test build for the experimental native-resume fork: runs the resume unit
# tests and produces the portable app folder + portable ZIP (no installer,
# no secrets). The existing release.yml (MSI + Inno Setup) is untouched and
# can be dispatched manually when a full installer is needed.

on:
  push:
    branches: [feature/native-extension-resume]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-test-build
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run resume tests
        run: ./gradlew :app:test --tests "com.lagradost.desktop.resume.*" :library:jvmTest --tests "com.lagradost.cloudstream3.resume.*" --no-daemon

      - name: Build portable ZIP
        run: ./gradlew :app:portableZip --no-daemon

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows-NativeTest-Portable
          path: dist/release/*-portable.zip

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: app/build/reports/tests/
