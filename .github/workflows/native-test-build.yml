name: e-cloudstream Windows build

# Test build for the experimental native-resume fork: runs the resume unit
# tests and produces a portable ZIP, MSI and Inno Setup installer. These are
# unsigned test packages published as an unofficial Eimon prerelease.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: native-test-build
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Windows compatibility, player, resume and updater tests
        run: ./gradlew :android:test :app:test :library:jvmTest --tests "com.lagradost.cloudstream3.resume.*" --no-daemon

      - name: Build portable ZIP
        run: ./gradlew :app:portableZip --no-daemon

      - name: Locate WiX Toolset 3
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" | Select-Object -First 1
          }
          if (-not $wix) { throw "WiX Toolset 3 was not found" }
          $wix.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI installer
        run: ./gradlew :app:installerMsi --no-daemon

      - name: Build setup executable
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          $ver = (Select-String -Path "app/build.gradle.kts" -Pattern 'val desktopVersion = "([^"]+)"').Matches.Groups[1].Value
          if (-not $ver) { throw "Desktop version not found" }
          & $iscc "/DAppVersion=$ver" "tools\installer\cloudstream.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Write artifact checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/release/* -File | Where-Object { $_.Extension -in '.zip', '.msi', '.exe' }
          if ($files.Count -ne 3) { throw "Expected portable ZIP, MSI and setup EXE" }
          $files | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } | Set-Content dist/release/SHA256SUMS.txt

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows-NativeTest-Portable
          path: dist/release/*-portable.zip
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows-NativeTest-Installers
          path: |
            dist/release/*.msi
            dist/release/*-setup.exe
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: |
            app/build/reports/tests/
            android/build/reports/tests/
            library/build/reports/tests/

      - name: Publish Eimon GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = (Select-String -Path "app/build.gradle.kts" -Pattern 'val desktopVersion = "([^"]+)"').Matches.Groups[1].Value
          if (-not $ver) { throw "Desktop version not found" }
          $tag = "v$ver.$env:GITHUB_RUN_NUMBER"
          @'
          e-cloudstream — an independent, unofficial CloudStream/cs3d fork directed by @mohamedyassine-benmiled.

          New in 1.0.8: touch double-tap seeking on the video (left half -10 seconds, right half +10 seconds), retaining mouse double-click fullscreen. Touch singles still toggle playback after the double-tap interval. Windows WebView cookies are refreshed on Android API reads, encrypted flushing is functional, incomplete/stale snapshots are rejected, and live browser-default user agents are reported where available. Live AniKoto session retention and physical touchscreen acceptance still need user testing; these are not claims that server-side sign-outs are proven fixed.

          Includes upstream main through b9085f8 (upstream 1.0.7), preserving e-cloudstream branding, fork-owned updates and account/cloud capabilities. Android and extension sources/binaries are not changed by this Windows release. Existing installed data paths and upgrade identities remain unchanged.

          Cloud title progress and native Watching – New Episodes require an extension advertising the corresponding host capabilities. The series page projects the saved account position, treats earlier same-season/same-edition episodes as watched, and uses the existing spoiler toggle without importing cloud records into local history. New Episodes opens the newest eligible episode in the saved audio edition at zero after fresh validation. Stock/older hosts and older extension adapters retain their fallback behaviour.

          Windows touchscreen support: vertical page/list swipes, horizontal poster-shelf swipes, tap-versus-drag handling, and touch-aware player controls. Settings → Appearance → Touchscreen swipes offers Auto / On / Off; On is a fallback for drivers without touch-source detection and also enables mouse drag-to-scroll. Maximized window controls and the navigation dock remain accessible during touch use. Single-finger support; physical touchscreen acceptance testing remains necessary.

          Account Continue Watching is an ordinary row inside its owning provider when an extension advertises the required capabilities, retaining progress/remaining time, pagination and native episode/timestamp resume. Other extensions are unchanged, and no extension update is needed for row placement.

          Includes unsigned setup EXE, MSI and portable ZIP, with the experimental native account-resume bridge enabled. The app is named e-cloudstream; versions no longer use the -eimon suffix. Existing data folders, launcher and upgrade identity are retained. Older builds may need this setup downloaded manually after the repository rename. Check SHA256SUMS.txt before installation.
          '@ | Set-Content release-notes.md -Encoding utf8
          $assets = @(Get-ChildItem dist/release -File | Where-Object { $_.Extension -in '.exe', '.msi', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 4) { throw "Expected EXE, MSI, ZIP and checksums" }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "e-cloudstream $ver (build $env:GITHUB_RUN_NUMBER)" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
