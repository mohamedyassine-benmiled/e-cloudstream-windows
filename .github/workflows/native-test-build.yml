name: Native test build

# Test build for the experimental native-resume fork: runs the resume unit
# tests and produces a portable ZIP, MSI and Inno Setup installer. These are
# unsigned test packages published as an unofficial Eimon prerelease.

on:
  push:
    branches: [feature/native-extension-resume]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: native-test-build
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run resume tests
        run: ./gradlew :app:test --tests "com.lagradost.desktop.resume.*" :library:jvmTest --tests "com.lagradost.cloudstream3.resume.*" --no-daemon

      - name: Build portable ZIP
        run: ./gradlew :app:portableZip --no-daemon

      - name: Locate WiX Toolset 3
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" | Select-Object -First 1
          }
          if (-not $wix) { throw "WiX Toolset 3 was not found" }
          $wix.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI installer
        run: ./gradlew :app:installerMsi --no-daemon

      - name: Build setup executable
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          $ver = (Select-String -Path "app/build.gradle.kts" -Pattern 'val desktopVersion = "([^"]+)"').Matches.Groups[1].Value
          if (-not $ver) { throw "Desktop version not found" }
          & $iscc "/DAppVersion=$ver" "tools\installer\cloudstream.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Write artifact checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/release/* -File | Where-Object { $_.Extension -in '.zip', '.msi', '.exe' }
          if ($files.Count -ne 3) { throw "Expected portable ZIP, MSI and setup EXE" }
          $files | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } | Set-Content dist/release/SHA256SUMS.txt

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows-NativeTest-Portable
          path: dist/release/*-portable.zip
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows-NativeTest-Installers
          path: |
            dist/release/*.msi
            dist/release/*-setup.exe
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: |
            app/build/reports/tests/
            library/build/reports/tests/

      - name: Publish Eimon GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = (Select-String -Path "app/build.gradle.kts" -Pattern 'val desktopVersion = "([^"]+)"').Matches.Groups[1].Value
          if (-not $ver) { throw "Desktop version not found" }
          $tag = "v$ver-eimon.$env:GITHUB_RUN_NUMBER"
          @'
          Unofficial Eimon fork — not an official CloudStream/cs3d release.

          Account Continue Watching is now an ordinary row inside its owning provider, retaining progress/remaining time, pagination and native episode/timestamp resume. Only the maintainer's compatible AniKoto / AniKoto Account extensions currently support this feature; other extensions are unchanged. No extension update is needed for row placement.

          Includes unsigned setup EXE, MSI and portable ZIP, with the experimental native account-resume bridge enabled. Check SHA256SUMS.txt before installation. Windows installer metadata remains numeric; app versions and package filenames use -eimon.
          '@ | Set-Content release-notes.md -Encoding utf8
          $assets = @(Get-ChildItem dist/release -File | Where-Object { $_.Extension -in '.exe', '.msi', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 4) { throw "Expected EXE, MSI, ZIP and checksums" }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "CloudStream $ver-eimon (build $env:GITHUB_RUN_NUMBER)" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
