name: Publish verified Windows prerelease

on:
  push:
    branches: [release/native-test-1]
    paths:
      - .github/workflows/publish-native-test.yml
      - docs/releases/native-test-1.md
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-native-test-1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '38799294038'
      BUILD_SHA: 9ddce58639ea3459ac63bf4aacb66a1d17c548b4
      RELEASE_TAG: v1.0.3-native-test.1
    steps:
      - uses: actions/checkout@v4

      - name: Verify source build provenance
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('build-run.json'))
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['head_sha'] == os.environ['BUILD_SHA']
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/native-test-build.yml'
          print('Verified successful build of', run['head_sha'])
          PY

      - name: Download existing build artifacts inside GitHub
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '38799294038'
          pattern: CloudStream-Windows-NativeTest-*
          merge-multiple: true
          path: assets

      - name: Verify all release file checksums
        shell: bash
        working-directory: assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('.')
          expected_names = {
              'CloudStream-1.0.3-windows-x64-setup.exe',
              'CloudStream-1.0.3-windows-x64.msi',
              'CloudStream-1.0.3-windows-x64-portable.zip',
          }
          seen = set()
          for line in root.joinpath('SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
              digest, name = line.split(None, 1)
              name = name.strip()
              assert name in expected_names and name not in seen, name
              path = root / name
              assert path.stat().st_size > 0
              with path.open('rb') as f:
                  actual = hashlib.file_digest(f, 'sha256').hexdigest()
              assert actual == digest.lower(), name
              seen.add(name)
              print('Verified', name, path.stat().st_size, actual)
          assert seen == expected_names
          assert {p.name for p in root.iterdir()} == expected_names | {'SHA256SUMS.txt'}
          PY

      - name: Attach assets and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          # A failed upload leaves a draft, never an incomplete public release.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > existing-release.txt 2>/dev/null; then
            test "$(cat existing-release.txt)" = 'true'
          else
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --draft --prerelease \
              --title 'CloudStream Windows 1.0.3 — Native Test 1' \
              --notes-file docs/releases/native-test-1.md
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python3 - <<'PY'
          import json, pathlib
          local = {p.name: p.stat().st_size for p in pathlib.Path('assets').iterdir()}
          remote = {p['name']: p['size'] for p in json.load(open('release-assets.json'))['assets']}
          assert remote == local, (remote, local)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
